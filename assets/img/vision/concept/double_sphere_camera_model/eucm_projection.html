<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EUCM projection</title>
<style>
:root{--bg:#ffffff;--text:#1f1f1d;--sub:#5f5e5a;--muted:#9a998f;--line:#d3d1c7;--purple:#7F77DD;--purpleD:#534AB7;--teal:#1D9E75;--tealD:#0F6E56;--red:#E24B4A;--hl:#D85A30;--plane:#D85A30;}
@media (prefers-color-scheme: dark){:root{--bg:#1e1e1c;--text:#ecebe6;--sub:#b4b2a9;--muted:#888780;--line:#555550;--purpleD:#AFA9EC;--tealD:#5DCAA5;}}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;color:var(--sub)}
button{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);cursor:pointer}
input[type=range]{flex:1;min-width:160px;accent-color:var(--purpleD)}
.val{min-width:170px;color:var(--text);font-variant-numeric:tabular-nums}
svg{width:100%;height:auto;display:block}
#cs{margin-top:6px;color:var(--text)}
</style>
</head>
<body>
<div class="row"><span>α</span><input type="range" id="al" min="0" max="0.75" step="0.01" value="0.5"><span class="val" id="ao"></span></div>
<div class="row"><span>β</span><input type="range" id="be" min="0.3" max="3" step="0.01" value="2"><span class="val" id="bo"></span></div>
<div class="row"><span>θ</span><input type="range" id="th" min="0" max="175" step="1" value="100"><span class="val" id="to"></span></div>
<div class="row">
<button data-a="0.5" data-b="1">UCM과 동일 β=1</button>
<button data-a="0.5" data-b="2">β=2 (더 압축)</button>
<button data-a="0.5" data-b="0.5">β=0.5 (덜 압축)</button>
<button data-a="0.6" data-b="1.17">논문 GoPro α=0.60, β=1.17</button>
</div>
<svg id="sv" viewBox="0 0 760 345" role="img" aria-label="α, β에 따른 EUCM 투영 기하와 입사각-반경 곡선"></svg>
<div id="cs"></div>
<script>
(function(){
var sv=document.getElementById('sv'),NS='http://www.w3.org/2000/svg';
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function el(t,a,txt){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;sv.appendChild(e);return e;}
function rho(t,b){var s=Math.sin(t),c=Math.cos(t);return Math.sqrt(b*s*s+c*c);}
function den(t,a,b){return a*rho(t,b)+(1-a)*Math.cos(t);}
var RAYS=[30,60,90,120,150];
function draw(){
var a=+document.getElementById('al').value,b=+document.getElementById('be').value,thd=+document.getElementById('th').value,th=thd*Math.PI/180;
var xi=a/(1-a),w=a<=0.5?xi:(1-a)/a;
function ok(t){return Math.cos(t)>-w*rho(t,b)+1e-6&&den(t,a,b)>1e-6;}
var C={text:css('--text'),sub:css('--sub'),muted:css('--muted'),line:css('--line'),p:css('--purple'),pd:css('--purpleD'),t:css('--teal'),td:css('--tealD'),r:css('--red'),h:css('--hl'),pl:css('--plane')};
sv.innerHTML='';
var cx=170,cy=130,S=65,cpy=cy+xi*S,py=cy-S,XR=380;
el('circle',{cx:cx,cy:cy,r:S,fill:'none',stroke:C.line,'stroke-width':1,'stroke-dasharray':'4 4'});
el('ellipse',{cx:cx,cy:cy,rx:S/Math.sqrt(b),ry:S,fill:'none',stroke:C.pd,'stroke-width':1.5});
el('line',{x1:cx,y1:340,x2:cx,y2:20,stroke:C.muted,'stroke-width':0.7});
el('line',{x1:20,y1:py,x2:XR,y2:py,stroke:C.pl,'stroke-width':1.5});
el('text',{x:22,y:py-8,'font-size':12,fill:C.pl},'평면 z = 1');
function ray(t,col,lw,main){
 var rh=rho(t,b),sx=cx+Math.sin(t)/rh*S,sy=cy-Math.cos(t)/rh*S;
 if(!ok(t)){el('circle',{cx:sx,cy:sy,r:main?5:3.5,fill:'none',stroke:C.r,'stroke-width':1.4});return null;}
 var m=Math.sin(t)/den(t,a,b),px=cx+m*S,pyy=py,out=false;
 if(px>XR){var k=(XR-cx)/(px-cx);pyy=cpy+k*(py-cpy);px=XR;out=true;}
 el('line',{x1:cx,y1:cpy,x2:sx,y2:sy,stroke:col,'stroke-width':lw});
 el('line',{x1:sx,y1:sy,x2:px,y2:pyy,stroke:col,'stroke-width':lw*0.7,'stroke-dasharray':'3 3',opacity:out?0.4:0.75});
 el('circle',{cx:sx,cy:sy,r:main?4.5:3,fill:col});
 if(!out)el('circle',{cx:px,cy:py,r:main?5:4,fill:main?col:C.t});
 return m;
}
var pts=[];RAYS.forEach(function(d){var m=ray(d*Math.PI/180,C.p,1.2,false);if(m!==null)pts.push([d,m]);});
var hm=ray(th,C.h,2.4,true);
el('circle',{cx:cx,cy:cpy,r:5.5,fill:C.pd});
el('text',{x:cx-12,y:cpy+5,'text-anchor':'end','font-size':12,fill:C.pd},'투영 중심 (ξ = '+xi.toFixed(2)+')');
var X0=460,X1=745,Y0=310,Y1=30,rmax=4;
function tx(v){return X0+(v/180)*(X1-X0);}function ty(r){return Y0-(r/rmax)*(Y0-Y1);}
el('line',{x1:X0,y1:Y0,x2:X1,y2:Y0,stroke:C.muted,'stroke-width':0.8});
el('line',{x1:X0,y1:Y0,x2:X0,y2:Y1,stroke:C.muted,'stroke-width':0.8});
[0,90,180].forEach(function(v){el('text',{x:tx(v),y:Y0+16,'text-anchor':'middle','font-size':11,fill:C.muted},v+'°');});
[0,2,4].forEach(function(r){el('text',{x:X0-6,y:ty(r)+4,'text-anchor':'end','font-size':11,fill:C.muted},r);});
el('text',{x:X1,y:Y0+32,'text-anchor':'end','font-size':12,fill:C.sub},'입사각 θ');
el('text',{x:X0+6,y:Y1-10,'font-size':12,fill:C.sub},'반경 r′');
function curve(bb,col,lw,dash,split){
 var pv='',pi='',wu=a<=0.5?xi:(1-a)/a;
 for(var c=0;c<=180;c+=0.5){var t=c*Math.PI/180,dn=a*rho(t,bb)+(1-a)*Math.cos(t);if(dn<=1e-6)break;var r=Math.sin(t)/dn;if(r>rmax||r<0)break;
  var pt=tx(c).toFixed(1)+' '+ty(r).toFixed(1),v=Math.cos(t)>-wu*rho(t,bb)+1e-6;
  if(!v&&!split)break;if(v)pv+=(pv?'L':'M')+pt;else pi+=(pi?'L':'M')+pt;}
 var at={d:pv,fill:'none',stroke:col,'stroke-width':lw};if(dash)at['stroke-dasharray']=dash;el('path',at);
 if(pi)el('path',{d:pi,fill:'none',stroke:C.r,'stroke-width':1.5,'stroke-dasharray':'4 3'});
}
var p='';for(var q=0;q<89.5;q+=0.5){var rr=Math.tan(q*Math.PI/180);if(rr>rmax)break;p+=(p?'L':'M')+tx(q).toFixed(1)+' '+ty(rr).toFixed(1);}
el('path',{d:p,fill:'none',stroke:C.muted,'stroke-width':1.2,'stroke-dasharray':'5 4'});
if(Math.abs(b-1)>0.005)curve(1,C.muted,1.4,'2 3',false);
curve(b,C.p,2.2,null,true);
pts.forEach(function(q){if(q[1]<=rmax)el('circle',{cx:tx(q[0]),cy:ty(q[1]),r:4,fill:C.t});});
if(hm!==null&&hm<=rmax)el('circle',{cx:tx(thd),cy:ty(hm),r:5.5,fill:C.h});
var lx=X1-185;
el('line',{x1:lx,y1:48,x2:lx+20,y2:48,stroke:C.p,'stroke-width':2.2});el('text',{x:lx+26,y:52,'font-size':12,fill:C.sub},'EUCM');
el('line',{x1:lx+70,y1:48,x2:lx+90,y2:48,stroke:C.muted,'stroke-width':1.4,'stroke-dasharray':'2 3'});el('text',{x:lx+96,y:52,'font-size':12,fill:C.sub},'UCM');
el('line',{x1:lx+130,y1:48,x2:lx+150,y2:48,stroke:C.muted,'stroke-width':1.2,'stroke-dasharray':'5 4'});el('text',{x:lx+156,y:52,'font-size':12,fill:C.sub},'핀홀');
var tmax=w<=0?90:(180-Math.atan(Math.sqrt(Math.max(0,1-w*w))/(w*Math.sqrt(b)))*180/Math.PI);
document.getElementById('ao').textContent='α = '+a.toFixed(2);
document.getElementById('bo').textContent='β = '+b.toFixed(2);
document.getElementById('to').textContent=thd+'°  →  '+(hm===null?'투영 불가':(hm>rmax?'r′ = '+hm.toFixed(2)+' (그래프 밖)':'r′ = '+hm.toFixed(2)));
var msg=Math.abs(b-1)<=0.005?'β = 1: 타원체가 단위 구가 되어 UCM과 같음':(b>1?'β > 1: 타원체가 가로로 좁아져 바깥 방향이 UCM보다 더 압축됨':'β < 1: 타원체가 가로로 넓어져 바깥 방향이 UCM보다 덜 압축됨');
document.getElementById('cs').textContent=msg+'  ·  최대 유효 입사각 '+tmax.toFixed(0)+'°';
}
['al','be','th'].forEach(function(id){document.getElementById(id).addEventListener('input',draw);});
Array.prototype.forEach.call(document.querySelectorAll('button[data-a]'),function(btn){btn.addEventListener('click',function(){document.getElementById('al').value=btn.getAttribute('data-a');document.getElementById('be').value=btn.getAttribute('data-b');draw();});});
if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
draw();
})();
</script>
</body>
</html>
